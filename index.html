<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1b2340" />
    <meta name="description" content="한국어문회 전국한자능력검정시험 8급~6급 기준으로 노는 한자 학습 게임" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="한자놀이" />
    <title>한자놀이 · 급수 한자 게임</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 서비스 워커는 **배포본에서만** 등록한다.
      // 개발 서버(localhost)에서 등록했더니 고친 코드가 아니라 캐시된 옛 코드가 계속 떠서,
      // 멀쩡히 고친 기능을 "안 고쳐졌다"고 몇 번이나 오판했다. 개발 중엔 등록하지 않고,
      // 예전에 등록해 둔 것이 남아 있으면 스스로 해제한다.
      if ('serviceWorker' in navigator) {
        var isLocal = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1
        if (isLocal) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) {
              r.unregister()
            })
          })
        } else {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register(new URL('sw.js', document.baseURI)).catch(function () {})
          })
        }
      }
    </script>
  </body>
</html>
